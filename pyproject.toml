[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prop_sim"
version = "0.1.0"
description = "UAV propeller six-component (6-DoF force/moment) test-rig simulator"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]
# JsonLinesHal.from_serial を使うときだけ必要 (ファイル/TCP なら不要).
serial = ["pyserial>=3.5"]

[project.scripts]
prop-sim = "prop_sim.cli:main"
uwb-loc = "uwb_loc.cli:main"

[tool.setuptools.packages.find]
include = ["prop_sim*", "uwb_loc*"]

[tool.setuptools.package-data]
uwb_loc = ["ui/static/*"]


[tool.pytest.ini_options]
testpaths = ["tests"]
